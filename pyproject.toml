[project]
name = "police-thief-p2p"
version = "0.1.0"
description = "Distributed Cops-and-Robbers over a Peer-to-Peer Network -- course final project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "anthropic>=0.40",
    "tomli-w>=1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/police_thief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
